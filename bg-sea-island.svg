<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB" />
      <stop offset="100%" stop-color="#BDEBFF" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B7BC6" />
      <stop offset="100%" stop-color="#1866B0" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)" />

  <!-- Sun -->
  <circle cx="1350" cy="120" r="60" fill="#FFD166" opacity="0.95" />

  <!-- Sea -->
  <rect y="350" width="1600" height="550" fill="url(#sea)" />

  <!-- Waves (simple) -->
  <g fill="rgba(255,255,255,0.08)">
    <path d="M0 420 C200 380 400 460 600 420 C800 380 1000 460 1200 420 C1400 380 1600 460 1600 460 L1600 480 L0 480 Z" />
    <path d="M0 460 C200 420 400 500 600 460 C800 420 1000 500 1200 460 C1400 420 1600 500 1600 500 L1600 520 L0 520 Z" />
  </g>

  <!-- Island -->
  <g transform="translate(420,300)">
    <ellipse cx="200" cy="220" rx="160" ry="60" fill="#6b3" stroke="#5aa" stroke-width="2" />
    <path d="M160 150 C180 120 220 120 240 150 L260 240 L100 240 Z" fill="#7CC54F" />
    <!-- Palm trunk -->
    <rect x="200" y="60" width="10" height="120" rx="5" fill="#7b4b2a" transform="rotate(-12 205 120)" />
    <!-- Leaves -->
    <path d="M205 70 C240 40 300 60 260 90" fill="none" stroke="#2f8f2f" stroke-width="10" stroke-linecap="round" />
    <path d="M205 80 C170 50 120 70 150 100" fill="none" stroke="#2f8f2f" stroke-width="10" stroke-linecap="round" />
  </g>

</svg>
